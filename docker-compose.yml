services:
  pulsar:
    build: .
    image: pulsar:latest
    ports:
      - "8741:8741"
    environment:
      PULSAR_SECRET: ${PULSAR_SECRET:-changeme}
    command:
      - pulsar
      - server
      - --addr
      - :8741
      - --secret
      - ${PULSAR_SECRET:-changeme}
    restart: unless-stopped
